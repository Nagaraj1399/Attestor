<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mixed Checkout Flow: Multi-Defect Verification</title>
  <style>
    * { box-sizing: border-box; transition: none !important; animation: none !important; }
    body { font-family: sans-serif; padding: 32px; margin: 0; color: #0f172a; }
    *:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    /* Criterion 2.4.7 violation: target payment button specifically strips outline with no fallback */
    #pay-now-btn:focus, #pay-now-btn:focus-visible { outline: none !important; box-shadow: none !important; }
    .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; max-width: 540px; margin-bottom: 20px; }
    .error-visual-only { border: 2px solid #ef4444 !important; }
  </style>
</head>
<body>
  <header>
    <!-- Defect 1: 1.1.1 Non-text Content: filename alt -->
    <img id="cart-banner" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='60'></svg>" alt="IMG_9941_checkout_banner.png" width="400" height="60" />
  </header>

  <main>
    <div class="card">
      <h1>Complete Your Order</h1>
      <p>Secure 256-bit encrypted checkout.</p>

      <form action="#" method="POST" onsubmit="return false;">
        <!-- Defect 3: 2.4.3 Focus Order Scrambled: Terms button positioned visually at bottom but first in DOM tabindex/flow -->
        <div style="margin-bottom: 16px;">
          <a href="#terms" id="order-terms" style="display: inline-block; margin-bottom: 8px;">Review Terms of Service</a>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="card-num">Card Number</label>
          <input type="text" id="card-num" value="4111 2222 3333 4444" style="width: 100%; padding: 8px; margin-top: 4px;" />
        </div>

        <div style="margin-bottom: 12px;">
          <!-- Defect 5: 3.3.1 Silent Form Error: Visual red border applied without aria-invalid or alert -->
          <label for="cvv-input">CVV Security Code</label>
          <input type="text" id="cvv-input" class="error-visual-only" value="12" style="width: 100%; padding: 8px; margin-top: 4px;" />
          <span style="color: #ef4444; font-size: 13px;">Must be 3 or 4 digits</span>
        </div>

        <!-- Defect 4 & 6: 2.4.7 (outline: none !important) and 4.1.2 (unnamed button: SVG only, no accessible name) -->
        <div style="margin-top: 20px;">
          <button id="pay-now-btn" type="submit" style="background: #16a34a; padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Defect 2: 2.1.2 Keyboard Trap Modal -->
    <div id="confirm-modal" role="dialog" aria-modal="true" style="border: 2px solid #cbd5e1; padding: 20px; border-radius: 8px; max-width: 540px; background: #f8fafc;">
      <h2>Two-Factor Challenge</h2>
      <p>Enter the 6-digit verification code sent to your device.</p>
      <input type="text" id="otp-input" placeholder="000000" style="padding: 8px; width: 100%;" />
      <button id="verify-otp-btn" type="button" style="margin-top: 10px; padding: 8px 16px;">Confirm</button>
    </div>
  </main>

  <script>
    // Planted keyboard trap inside confirm-modal: prevents Escape and confines focus cyclically
    const modal = document.getElementById('confirm-modal');
    const otp = document.getElementById('otp-input');
    const btn = document.getElementById('verify-otp-btn');
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        e.preventDefault(); // Trap prevents escape
      }
      if (e.key === 'Tab') {
        if (document.activeElement === btn && !e.shiftKey) {
          e.preventDefault();
          otp.focus();
        } else if (document.activeElement === otp && e.shiftKey) {
          e.preventDefault();
          btn.focus();
        }
      }
    });
  </script>
</body>
</html>
