<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Baseline — Attestor Violation Zoo Control Page</title>
  <style>
    /* Inlined fonts, zero animations, forced reduced motion */
    * {
      box-sizing: border-box;
      transition: none !important;
      animation: none !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #0f172a;
      background: #ffffff;
      padding: 32px;
      margin: 0;
    }
    /* Strictly compliant 2px high-contrast focus rings (WCAG 2.4.7 / 2.4.11) */
    *:focus-visible {
      outline: 2px solid #2563eb !important;
      outline-offset: 2px !important;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    .sr-only:focus {
      position: static;
      width: auto;
      height: auto;
      padding: 8px 16px;
      background: #2563eb;
      color: #ffffff;
      font-weight: bold;
    }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      max-width: 640px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 1. Compliant Skip Link (WCAG 2.4.1) -->
  <a href="#main-content" class="sr-only">Skip to main content</a>

  <header>
    <!-- 2. Compliant Logo with meaningful alt text (WCAG 1.1.1) -->
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='36'><rect width='120' height='36' fill='%232563eb'/><text x='16' y='24' fill='white' font-family='sans-serif' font-weight='bold' font-size='16'>ACME</text></svg>" alt="Acme Cloud Enterprise Home" width="120" height="36" />
    <nav aria-label="Main Navigation">
      <a href="#services" style="margin-left: 16px; color: #2563eb; text-decoration: underline;">Services Overview</a>
    </nav>
  </header>

  <main id="main-content">
    <div class="card" style="margin-top: 24px;">
      <!-- 3. Semantic Heading 1 (WCAG 1.3.1) -->
      <h1>Verify Account Information</h1>
      <p>Please enter your corporate email address to receive authorization tokens.</p>

      <form action="#" method="POST" onsubmit="return false;">
        <div class="form-group">
          <!-- 4. Explicit label linking (WCAG 3.3.2) -->
          <label for="work-email">Corporate Work Email</label>
          <input type="text" id="work-email" name="work-email" required aria-required="true" autocomplete="email" />
        </div>

        <button type="submit" id="save-btn">
          Save and Continue
        </button>
      </form>
    </div>
  </main>
</body>
</html>
