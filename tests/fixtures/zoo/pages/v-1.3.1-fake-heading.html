<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planted Violation: 1.3.1 Fake Heading Structure</title>
  <style>
    * { box-sizing: border-box; transition: none !important; animation: none !important; }
    body { font-family: sans-serif; padding: 32px; margin: 0; color: #0f172a; }
    *:focus-visible { outline: 2px solid #2563eb !important; outline-offset: 2px !important; }
    /* Visual pseudo heading style applied to standard paragraph tag */
    .fake-h2 { font-size: 24px; font-weight: bold; margin: 24px 0 8px 0; color: #0f172a; }
  </style>
</head>
<body>
  <main>
    <h1>Enterprise Portal</h1>
    
    <!-- PLANTED VIOLATION: Visually bold styled paragraph without heading tag or role="heading" -->
    <p class="fake-h2">Billing and Invoicing Information</p>
    <p>Manage subscription tier and payment card updates.</p>

    <div>
      <button id="view-invoices" type="button" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px;">
        View Invoices
      </button>
    </div>
  </main>
</body>
</html>
