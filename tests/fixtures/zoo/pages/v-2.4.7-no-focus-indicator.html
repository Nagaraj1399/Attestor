<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planted Violation: 2.4.7 No Focus Indicator</title>
  <style>
    * { box-sizing: border-box; transition: none !important; animation: none !important; }
    body { font-family: sans-serif; padding: 32px; margin: 0; color: #0f172a; }
    /* PLANTED VIOLATION: Global destructive focus suppression without fallback outline/shadow */
    *:focus, *:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border-color: initial !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Checkout Order Summary</h1>
    <p>Please review and confirm purchase.</p>
    <div style="margin-top: 16px;">
      <a href="#terms" id="terms-link" style="color: #2563eb; margin-right: 16px;">Terms of Sale</a>
      <button id="submit-order" type="button" style="padding: 10px 20px; background: #0f172a; color: white; border: none; border-radius: 4px;">
        Submit Order
      </button>
    </div>
  </main>
</body>
</html>
