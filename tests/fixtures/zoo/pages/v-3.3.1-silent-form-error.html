<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planted Violation: 3.3.1 Silent Form Error</title>
  <style>
    * { box-sizing: border-box; transition: none !important; animation: none !important; }
    body { font-family: sans-serif; padding: 32px; margin: 0; color: #0f172a; }
    *:focus-visible { outline: 2px solid #2563eb !important; outline-offset: 2px !important; }
    /* Visual only red border - zero programmatic invalidity */
    .has-error { border: 2px solid #dc2626 !important; }
  </style>
</head>
<body>
  <main>
    <h1>User Registration</h1>
    <form action="#" method="POST" onsubmit="return false;">
      <div>
        <label for="email-input">Work Email</label>
        <!-- PLANTED VIOLATION: Has red border class but lacks aria-invalid="true" and lacks aria-describedby -->
        <input type="text" id="email-input" class="has-error" value="invalid-email-string" />
        <p style="color: #dc2626; font-size: 13px; margin: 4px 0 0 0;">Please enter a valid corporate email.</p>
      </div>
      <div style="margin-top: 16px;">
        <button id="register-btn" type="submit" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px;">
          Register
        </button>
      </div>
    </form>
  </main>
</body>
</html>
