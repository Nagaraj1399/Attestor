name: Attestor CI & Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Automated Verification & Compliance Gating
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Setup Python (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Master Verification Suite (Unit, Integration, Eval Gates, SSRF)
        run: python3 run_tests.py
